openapi: 3.0.3
info:
  title: ChapuZapp API
  version: 1.0.0
  description: API REST de ChapuZapp.
servers:
  - url: http://localhost:3000
    description: Local
tags:
  - name: Auth
    description: Registro e inicio de sesión
  - name: Users
    description: Datos del usuario conectado
  - name: Citas
    description: Reservar una cita, consultar las propias y cancelarlas
  - name: Profesionales
    description: Búsqueda, filtros, paginación y detalle de profesionales
  - name: Sectores
    description: Listado de sectores de actividad
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registrar un usuario
      description: Crea una cuenta nueva. La contraseña se guarda cifrada con bcrypt y nunca se devuelve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              nombre: Ana Prueba
              email: ana@chapuzapp.test
              password: Chapuzapp123
              rol: CLIENTE
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                idUsuario: 3
                nombre: Ana Prueba
                email: ana@chapuzapp.test
                rol: CLIENTE
                telefono: null
                ciudad: null
                foto: null
                creadoEn: '2026-11-04T16:10:00.000Z'
        '400':
          description: Datos inválidos o incompletos. Indica qué campo falla.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              example:
                errors:
                  formErrors: []
                  fieldErrors:
                    nombre: ['El nombre debe tener al menos 2 caracteres']
                    email: ['Email inválido']
                    password: ['La contraseña debe tener al menos 8 caracteres']
                    rol: ['El rol debe ser CLIENTE o PROFESIONAL']
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Email ya registrado
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: Comprueba el email y la contraseña y devuelve un token JWT (con sub, email y rol, caduca a las 24 horas) junto con los datos del usuario. Si el email no existe o la contraseña es incorrecta, responde 401 con el mismo mensaje en ambos casos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: cliente@chapuzapp.test
              password: Chapuzapp123
      responses:
        '200':
          description: Login correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                usuario:
                  idUsuario: 1
                  nombre: Cliente Seed
                  email: cliente@chapuzapp.test
                  rol: CLIENTE
                  telefono: null
                  ciudad: null
                  foto: null
                  creadoEn: '2026-11-04T13:00:00.000Z'
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Faltan campos o el formato no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              example:
                errors:
                  formErrors: []
                  fieldErrors:
                    password: ['La contraseña es obligatoria']
        '401':
          description: Email inexistente o contraseña incorrecta (mismo mensaje en los dos casos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Credenciales inválidas
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Error interno del servidor
  /api/users/me:
    patch:
      tags: [Users]
      summary: Editar los datos del usuario conectado
      description: Modifica nombre, teléfono, ciudad y foto del usuario del token. No permite cambiar el rol, el email ni la contraseña.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              nombre: Ana
              telefono: '600123456'
              ciudad: Málaga
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                idUsuario: 7
                nombre: Ana
                email: ana.prueba@test.com
                rol: CLIENTE
                telefono: '600123456'
                ciudad: Málaga
                foto: null
                creadoEn: '2026-11-16T12:49:53.928Z'
        '400':
          description: Datos no válidos o campos no permitidos (rol, email, password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '401':
          description: Falta el token o no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/citas/disponibilidad:
    get:
      tags: [Citas]
      summary: Franjas libres de un profesional en un día
      description: Devuelve las franjas libres de 1 hora de un profesional para una fecha, a partir de sus horarios. Se descartan las franjas ya ocupadas por una cita programada y las que ya han empezado. Todas las horas están en UTC. Si el profesional no trabaja ese día, la lista sale vacía.
      security:
        - bearerAuth: []
      parameters:
        - name: profesionalId
          in: query
          required: true
          description: Identificador del profesional (idProfesional).
          schema:
            type: integer
            minimum: 1
          example: 1
        - name: fecha
          in: query
          required: true
          description: Día a consultar, en formato AAAA-MM-DD.
          schema:
            type: string
            format: date
          example: '2026-12-01'
      responses:
        '200':
          description: Franjas libres (puede ser una lista vacía)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilidad'
              example:
                profesionalId: 1
                fecha: '2026-12-01'
                franjas:
                  - inicio: '2026-12-01T10:00:00.000Z'
                    fin: '2026-12-01T11:00:00.000Z'
                  - inicio: '2026-12-01T11:00:00.000Z'
                    fin: '2026-12-01T12:00:00.000Z'
        '400':
          description: Falta algún parámetro o el formato no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              example:
                errors:
                  formErrors: []
                  fieldErrors:
                    fecha: ['La fecha debe tener el formato AAAA-MM-DD']
        '401':
          description: Falta el token o no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: No autorizado
        '404':
          description: El profesional no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Profesional no encontrado
  /api/citas:
    post:
      tags: [Citas]
      summary: Reservar una cita
      description: Reserva una franja libre de un profesional para el cliente conectado. Solo pueden reservar usuarios con rol CLIENTE. La hora de inicio debe ser en punto, futura y estar entre las franjas libres (ver disponibilidad). La cita se crea ocupando 1 hora y queda en estado PROGRAMADA. Todas las horas están en UTC.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearCitaRequest'
            example:
              profesionalId: 1
              servicioId: 1
              inicio: '2026-12-01T10:00:00Z'
      responses:
        '201':
          description: Cita creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cita'
              example:
                idCita: 6
                clienteId: 1
                profesionalId: 1
                servicioId: 1
                inicio: '2026-12-01T10:00:00.000Z'
                fin: '2026-12-01T11:00:00.000Z'
                estado: PROGRAMADA
                creadoEn: '2026-11-23T11:12:41.370Z'
        '400':
          description: Datos inválidos (errors), fecha pasada u hora de inicio que no es en punto (message).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorValidacion'
                  - $ref: '#/components/schemas/Error'
              example:
                message: No se puede reservar en una fecha pasada
        '401':
          description: Falta el token o no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: No autorizado
        '403':
          description: El usuario no tiene rol CLIENTE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Acceso denegado
        '404':
          description: El servicio no existe o no pertenece a ese profesional.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Servicio no encontrado para ese profesional
        '409':
          description: La franja no está disponible (ya hay una cita, está fuera del horario o no es una franja válida).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: La franja seleccionada no está disponible
  /api/citas/mias:
    get:
      tags: [Citas]
      summary: Mis citas
      description: Lista las citas del usuario conectado con el servicio y el profesional incluidos. Con tipo=proximas devuelve las citas programadas que aún no han empezado, de la más cercana a la más lejana. Con tipo=pasadas devuelve el historial (citas que ya pasaron o que se han cancelado), de la más reciente a la más antigua. Sin tipo devuelve todas.
      security:
        - bearerAuth: []
      parameters:
        - name: tipo
          in: query
          required: false
          description: Filtra las citas por próximas o pasadas.
          schema:
            type: string
            enum: [proximas, pasadas]
      responses:
        '200':
          description: Lista de citas (puede estar vacía)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CitaDetalle'
              example:
                - idCita: 1
                  inicio: '2026-12-01T09:00:00.000Z'
                  fin: '2026-12-01T10:00:00.000Z'
                  estado: PROGRAMADA
                  servicio:
                    idServicio: 1
                    nombre: Reparación de fugas
                    precio: 45
                  profesional:
                    idProfesional: 1
                    nombre: Antonio Ruiz
                    direccion: Calle Larios 10, Málaga
        '400':
          description: El valor de tipo no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              example:
                errors:
                  formErrors: []
                  fieldErrors:
                    tipo: ['El tipo debe ser proximas o pasadas']
        '401':
          description: Falta el token o no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: No autorizado
  /api/citas/{id}/cancelar:
    patch:
      tags: [Citas]
      summary: Cancelar una cita
      description: Cancela una cita del usuario conectado. La cita no se borra, pasa a estado CANCELADA y su franja vuelve a quedar libre. Solo el dueño de la cita puede cancelarla y las citas pasadas no se pueden cancelar.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la cita (idCita).
          schema:
            type: integer
            minimum: 1
          example: 6
      responses:
        '200':
          description: Cita cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cita'
              example:
                idCita: 6
                clienteId: 1
                profesionalId: 1
                servicioId: 1
                inicio: '2026-12-01T10:00:00.000Z'
                fin: '2026-12-01T11:00:00.000Z'
                estado: CANCELADA
                creadoEn: '2026-11-23T11:12:41.370Z'
        '400':
          description: El id no es válido (errors) o la cita ya pasó (message).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/ErrorValidacion'
                  - $ref: '#/components/schemas/Error'
              example:
                message: No se puede cancelar una cita pasada
        '401':
          description: Falta el token o no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: No autorizado
        '403':
          description: La cita es de otro usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: No puedes cancelar una cita de otro usuario
        '404':
          description: La cita no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Cita no encontrada
        '409':
          description: La cita ya estaba cancelada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: La cita ya está cancelada
  /api/profesionales:
    get:
      tags: [Profesionales]
      summary: Listar y buscar profesionales
      description: Devuelve un listado paginado de profesionales aplicando búsqueda por texto, filtros y ordenación directamente en la base de datos.
      parameters:
        - name: q
          in: query
          required: false
          description: Texto de búsqueda (nombre, descripción, dirección, sector o servicio).
          schema:
            type: string
        - name: sectorId
          in: query
          required: false
          description: Filtrar por ID de sector.
          schema:
            type: integer
            minimum: 1
        - name: sector
          in: query
          required: false
          description: Filtrar por nombre de sector (insensible a mayúsculas).
          schema:
            type: string
        - name: precioMax
          in: query
          required: false
          description: Precio máximo de al menos uno de sus servicios.
          schema:
            type: number
            minimum: 0.01
        - name: valoracionMin
          in: query
          required: false
          description: Valoración media mínima (0 a 5).
          schema:
            type: number
            minimum: 0
            maximum: 5
        - name: orden
          in: query
          required: false
          description: Criterio de ordenación.
          schema:
            type: string
            enum: [valoracion, nombre, recientes]
            default: valoracion
        - name: page
          in: query
          required: false
          description: Número de página (empieza en 1).
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          description: Resultados por página (1 a 50).
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Listado paginado de profesionales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfesionalesPaginados'
        '400':
          description: Parámetros de consulta inválidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
  /api/profesionales/{id}:
    get:
      tags: [Profesionales]
      summary: Obtener detalle de un profesional
      description: Devuelve el perfil completo de un profesional con sus servicios, tarifas, horario y valoración media.
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del profesional (idProfesional).
          schema:
            type: integer
            minimum: 1
          example: 1
      responses:
        '200':
          description: Detalle del profesional
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfesionalDetalle'
        '400':
          description: ID inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
        '404':
          description: El profesional no existe.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Profesional no encontrado
  /api/sectores:
    get:
      tags: [Sectores]
      summary: Listar sectores
      description: Devuelve todos los sectores disponibles ordenados alfabéticamente.
      responses:
        '200':
          description: Listado de sectores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sector'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Rol:
      type: string
      enum: [CLIENTE, PROFESIONAL]
    RegisterRequest:
      type: object
      required: [nombre, email, password, rol]
      properties:
        nombre:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          format: password
        rol:
          $ref: '#/components/schemas/Rol'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          format: password
    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 2
        telefono:
          type: string
          minLength: 9
          maxLength: 20
        ciudad:
          type: string
          minLength: 2
        foto:
          type: string
          format: uri
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT firmado. Lleva sub (id), email y rol, y caduca a las 24 horas.
        usuario:
          $ref: '#/components/schemas/Usuario'
    Usuario:
      type: object
      properties:
        idUsuario:
          type: integer
        nombre:
          type: string
        email:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        telefono:
          type: string
          nullable: true
        ciudad:
          type: string
          nullable: true
        foto:
          type: string
          nullable: true
        creadoEn:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        message:
          type: string
    ErrorValidacion:
      type: object
      properties:
        errors:
          type: object
          properties:
            formErrors:
              type: array
              items:
                type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
    EstadoCita:
      type: string
      enum: [PROGRAMADA, CANCELADA]
    CrearCitaRequest:
      type: object
      additionalProperties: false
      required: [profesionalId, servicioId, inicio]
      properties:
        profesionalId:
          type: integer
          minimum: 1
        servicioId:
          type: integer
          minimum: 1
          description: Servicio que se contrata. Debe pertenecer al profesional.
        inicio:
          type: string
          format: date-time
          description: Inicio de la cita, en UTC y en hora en punto (por ejemplo 2026-12-01T10:00:00Z).
    Franja:
      type: object
      properties:
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
    Disponibilidad:
      type: object
      properties:
        profesionalId:
          type: integer
        fecha:
          type: string
          format: date
        franjas:
          type: array
          items:
            $ref: '#/components/schemas/Franja'
    Cita:
      type: object
      properties:
        idCita:
          type: integer
        clienteId:
          type: integer
        profesionalId:
          type: integer
        servicioId:
          type: integer
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
        estado:
          $ref: '#/components/schemas/EstadoCita'
        creadoEn:
          type: string
          format: date-time
    CitaDetalle:
      type: object
      properties:
        idCita:
          type: integer
        inicio:
          type: string
          format: date-time
        fin:
          type: string
          format: date-time
        estado:
          $ref: '#/components/schemas/EstadoCita'
        servicio:
          type: object
          properties:
            idServicio:
              type: integer
            nombre:
              type: string
            precio:
              type: number
        profesional:
          type: object
          properties:
            idProfesional:
              type: integer
            nombre:
              type: string
            direccion:
              type: string
              nullable: true
    Sector:
      type: object
      properties:
        idSector:
          type: integer
        nombre:
          type: string
    Servicio:
      type: object
      properties:
        idServicio:
          type: integer
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        precio:
          type: number
        duracionMin:
          type: integer
    Horario:
      type: object
      properties:
        idHorario:
          type: integer
        diaSemana:
          type: integer
          minimum: 0
          maximum: 6
        horaInicio:
          type: string
        horaFin:
          type: string
    ProfesionalResumen:
      type: object
      properties:
        idProfesional:
          type: integer
        nombre:
          type: string
        ciudad:
          type: string
          nullable: true
        foto:
          type: string
          nullable: true
        sector:
          $ref: '#/components/schemas/Sector'
        descripcion:
          type: string
          nullable: true
        direccion:
          type: string
          nullable: true
        valoracionMedia:
          type: number
        servicios:
          type: array
          items:
            type: object
            properties:
              idServicio:
                type: integer
              nombre:
                type: string
              precio:
                type: number
              duracionMin:
                type: integer
    ProfesionalDetalle:
      type: object
      properties:
        idProfesional:
          type: integer
        nombre:
          type: string
        telefono:
          type: string
          nullable: true
        ciudad:
          type: string
          nullable: true
        foto:
          type: string
          nullable: true
        sector:
          $ref: '#/components/schemas/Sector'
        descripcion:
          type: string
          nullable: true
        direccion:
          type: string
          nullable: true
        valoracionMedia:
          type: number
        creadoEn:
          type: string
          format: date-time
        servicios:
          type: array
          items:
            $ref: '#/components/schemas/Servicio'
        horarios:
          type: array
          items:
            $ref: '#/components/schemas/Horario'
    Paginacion:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer
    ProfesionalesPaginados:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ProfesionalResumen'
        pagination:
          $ref: '#/components/schemas/Paginacion'

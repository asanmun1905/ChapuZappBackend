openapi: 3.0.3
info:
  title: ChapuZapp API
  version: 1.0.0
  description: API REST de ChapuZapp.
servers:
  - url: http://localhost:3000
    description: Local
tags:
  - name: Auth
    description: Registro e inicio de sesión
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Registrar un usuario
      description: Crea una cuenta nueva. La contraseña se guarda cifrada con bcrypt y nunca se devuelve.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              nombre: Ana Prueba
              email: ana@chapuzapp.test
              password: Chapuzapp123
              rol: CLIENTE
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usuario'
              example:
                idUsuario: 3
                nombre: Ana Prueba
                email: ana@chapuzapp.test
                rol: CLIENTE
                creadoEn: '2026-11-04T16:10:00.000Z'
        '400':
          description: Datos inválidos o incompletos. Indica qué campo falla.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              example:
                errors:
                  formErrors: []
                  fieldErrors:
                    nombre: ['El nombre debe tener al menos 2 caracteres']
                    email: ['Email inválido']
                    password: ['La contraseña debe tener al menos 8 caracteres']
                    rol: ['El rol debe ser CLIENTE o PROFESIONAL']
        '409':
          description: El email ya está registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Email ya registrado
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      description: Comprueba el email y la contraseña y devuelve un token JWT (con sub, email y rol, caduca a las 24 horas) junto con los datos del usuario. Si el email no existe o la contraseña es incorrecta, responde 401 con el mismo mensaje en ambos casos.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: cliente@chapuzapp.test
              password: Chapuzapp123
      responses:
        '200':
          description: Login correcto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                usuario:
                  idUsuario: 1
                  nombre: Cliente Seed
                  email: cliente@chapuzapp.test
                  rol: CLIENTE
                  creadoEn: '2026-11-04T13:00:00.000Z'
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Faltan campos o el formato no es válido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorValidacion'
              example:
                errors:
                  formErrors: []
                  fieldErrors:
                    password: ['La contraseña es obligatoria']
        '401':
          description: Email inexistente o contraseña incorrecta (mismo mensaje en los dos casos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Credenciales inválidas
        '500':
          description: Error interno del servidor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                message: Error interno del servidor
components:
  schemas:
    Rol:
      type: string
      enum: [CLIENTE, PROFESIONAL]
    RegisterRequest:
      type: object
      required: [nombre, email, password, rol]
      properties:
        nombre:
          type: string
          minLength: 2
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          format: password
        rol:
          $ref: '#/components/schemas/Rol'
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          format: password
    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT firmado. Lleva sub (id), email y rol, y caduca a las 24 horas.
        usuario:
          $ref: '#/components/schemas/Usuario'
    Usuario:
      type: object
      properties:
        idUsuario:
          type: integer
        nombre:
          type: string
        email:
          type: string
          format: email
        rol:
          $ref: '#/components/schemas/Rol'
        creadoEn:
          type: string
          format: date-time
    Error:
      type: object
      properties:
        message:
          type: string
    ErrorValidacion:
      type: object
      properties:
        errors:
          type: object
          properties:
            formErrors:
              type: array
              items:
                type: string
            fieldErrors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string